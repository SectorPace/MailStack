
[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
unmaintained = "workspace"
unsound = "workspace"
yanked = "deny"
unused-ignored-advisory = "warn"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa is only used for DKIM signing (mail-auth), not for RSA decryption oracles; no fixed release exists" },
]

[licenses]
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
allow-wildcard-paths = true
wildcards = "deny"
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "openssl-src" },
    { name = "aws-lc-rs" },
    { name = "aws-lc-sys" },
    { name = "zstd" },
    { name = "zstd-safe" },
    { name = "zstd-sys" },
    { name = "libz-sys" },
    { name = "libz-ng-sys" },
    { name = "xz2" },
    { name = "liblzma-sys" },
    { name = "bzip2" },
    { name = "bzip2-sys" },
    { name = "cmake" },
    { name = "nasm-rs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
