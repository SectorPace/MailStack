name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SOURCE_DATE_EPOCH: 1704067200

jobs:
  quality:
    name: fmt + clippy + test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 (2.9.3, PGP 已校验)

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --locked --all-targets

  webui:
    name: webui build + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: 依赖必须由 lockfile 重建
        working-directory: webui
        run: npm ci

      - name: 类型检查 + 构建（index.html 管理台 + mail.html Webmail）
        working-directory: webui
        run: npm run build

      - name: 单元测试
        working-directory: webui
        run: npm test

  supply-chain:
    name: locked build + audit + deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 (2.9.3, PGP 已校验)

      - name: 锁定构建必须成功（AC-7）
        run: cargo build --release --locked --all-targets

      - name: cargo-deny（漏洞 / 许可白名单 / 来源白名单 / 通配依赖）
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2 (2.1.1, 2026-07-13)
        with:
          command: check

      - name: cargo-audit（RUSTSEC 漏洞库）
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit

  invariants:
    name: security invariants present
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: 1.98.1

      - name: 关键不变量测试必须存在
        run: |
          bash deploy/verify-invariant-gate.sh

      - name: 不变量测试必须真正通过（不允许 ignore）
        run: |
          set -e
          if grep -rnE '#\[ignore([[:space:]]*[=,][^]]*)?\]' crates/ bin/ ; then
            echo "::error::不变量测试不得标记为 ignore"
            exit 1
          fi
          if grep -rnE '#\[cfg\(any\(\)\)\]' crates/ bin/ ; then
            echo "::error::不变量测试不得用 #[cfg(any())] 编译期剔除"
            exit 1
          fi
          cargo test --locked --all-targets
