name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 6.3：最小权限。原先三个 job 都没有 `permissions:` 声明 ——
# 无声明时 GitHub 会授予仓库/组织默认的 GITHUB_TOKEN 权限，对本工作流远超所需
# （我们只读代码）。声明为只读后，即使某个 action 被投毒也拿不到写权限。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 可复现构建锚点（与 deploy/build.sh 一致）
  SOURCE_DATE_EPOCH: 1704067200

jobs:
  # ── 质量门禁：格式 + lint + 测试 ──
  quality:
    name: fmt + clippy + test
    runs-on: ubuntu-24.04
    steps:
      # 6.3：pin 到 commit SHA（v4 = actions/checkout@v4 的 tag 解析结果）。
      # tag 可被上游重新指向，SHA 不能。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 6.3：不把凭证留在 .git/config 里（后续任何一步都能读到它）。
          persist-credentials: false

      # 工具链在此固定（仓库根刻意不放 rust-toolchain.toml，原因见 TOOLCHAIN.md）。
      # 6.3：该 action 的 tag 名**本身就是工具链选择器**，直接 pin SHA 会丢掉版本语义；
      # 因此 pin 到 master 的 commit，并用 with.toolchain 显式钉住 1.98.1 —— 效果等价且不可被重指向。
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 (2.9.3, PGP 已校验)

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --locked --all-targets

  # ── 供应链门禁（规格书 §7）：锁定构建 + 漏洞 + 许可 ──
  supply-chain:
    name: locked build + audit + deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 (2.9.3, PGP 已校验)

      - name: 锁定构建必须成功（AC-7）
        run: cargo build --release --locked --all-targets

      # 6.1：这个 step 原先带 `continue-on-error: true`，而仓库里**根本没有
      # deny.toml** —— 也就是说它必然失败、失败又被永久吞掉，供应链门禁实质失效。
      # 现在 deny.toml 已入库（白名单来自本机 449 个 crate 的许可证实测归纳），
      # 并且不再允许失败。
      # 动作按 commit SHA 钉扎：该 SHA 即 v2 tag 的当前解析结果（2.1.1，2026-07-13，
      # 经 GitHub API 实测取回），tag 可被上游重新指向，SHA 不能。
      - name: cargo-deny（漏洞 / 许可白名单 / 来源白名单 / 通配依赖）
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2 (2.1.1, 2026-07-13)
        with:
          command: check

      # 6.1：原先 `cargo install ... || true` + `cargo audit || true` —— 装不上也过、
      # 有漏洞也过。现在两步都必须是真成功，且显式钉住 cargo-audit 版本：
      # 未钉版本时每次 CI 都可能拉到带新行为/新告警规则的新版，审计结果不可复现
      #（0.22.2 为 2026-11-01 时点 crates.io 上的最新非 yanked 版本）。
      - name: cargo-audit（RUSTSEC 漏洞库）
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit

  # ── 不变量门禁：确认安全关键断言未被删除或弱化 ──
  invariants:
    name: security invariants present
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # 与 quality / supply-chain 相同的工具链钉扎（从那两个 job 原样复制）。
      # 原先本 job 依赖 runner 预装的 rust：ubuntu-24.04 镜像里的 rustc 版本随
      # GitHub 镜像更新漂移，`cargo test` 的结果不可复现，与其它 job 也不同基线。
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: 1.98.1

      - name: 关键不变量测试必须存在
        run: |
          # 6.8：清单与判定逻辑都只有一份 —— deploy/required-invariants.txt +
          # deploy/verify-invariant-gate.sh。原先这里内联了 277 条名字和一份
          # 独立的 grep 判定，与本地脚本必然漂移。
          #
          # 6.2：判定已加强 —— 名字必须落在真正带 #[test] / #[tokio::test]
          # 的函数上，且函数体内至少有一个断言。原先的 `grep -rq "fn $name"`
          # 是子串匹配、不要求是测试、不检查断言，把测试掏空成空壳也照样通过。
          bash deploy/verify-invariant-gate.sh

      - name: 不变量测试必须真正通过（不允许 ignore）
        run: |
          set -e
          if grep -rn "#\[ignore\]" crates/ bin/ ; then
            echo "::error::不变量测试不得标记为 ignore"
            exit 1
          fi
          cargo test --locked --all-targets
