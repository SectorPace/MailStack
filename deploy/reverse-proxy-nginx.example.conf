limit_req_zone $binary_remote_addr zone=mailstack_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=mailstack_api:10m rate=30r/s;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server { listen 80; listen [::]:80; server_name mail.example.com webmail.example.com; return 301 https://$host$request_uri; }
server {
 listen 443 ssl http2; listen [::]:443 ssl http2; server_name mail.example.com;
 ssl_certificate /etc/mailstack/tls/mail.example.com/fullchain.pem;
 ssl_certificate_key /etc/mailstack/tls/mail.example.com/privkey.pem;
 add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
 add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; add_header Referrer-Policy no-referrer always;
 location = /api/auth/login { limit_req zone=mailstack_login burst=3 nodelay; proxy_pass http://127.0.0.1:8787; include proxy_params; }
 location /api/ { limit_req zone=mailstack_api burst=60 nodelay; proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
 location / { proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
server {
 listen 443 ssl http2; listen [::]:443 ssl http2; server_name webmail.example.com;
 ssl_certificate /etc/mailstack/tls/webmail.example.com/fullchain.pem; ssl_certificate_key /etc/mailstack/tls/webmail.example.com/privkey.pem;
 add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
 add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; add_header Referrer-Policy no-referrer always;
 location = /api/webmail/auth/login { limit_req zone=mailstack_login burst=3 nodelay; proxy_pass http://127.0.0.1:18788; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
 location / { proxy_pass http://127.0.0.1:18788; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
}
