[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/priv",
    "crates/web",
    "crates/smtp",
    "crates/queue",
    "crates/store",
    "crates/auth",
    "crates/smtpd",
    "crates/imappop3",
    "crates/imapd",
    "bin/mailstackd",
    "bin/mailstackctl",
    "bin/mailstack-web",
    "bin/mailstack-imap",
    "crates/webmail",
    "bin/mailstack-webmail",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/SectorPace/MailStack"
authors = ["SectorPace"]
publish = false

[workspace.dependencies]
mailstack-core = { path = "crates/core" }
mailstack-priv = { path = "crates/priv" }
mailstack-web = { path = "crates/web" }
mailstack-smtp = { path = "crates/smtp" }
mailstack-queue = { path = "crates/queue" }
mailstack-store = { path = "crates/store" }
mailstack-auth = { path = "crates/auth" }
mailstack-smtpd = { path = "crates/smtpd" }
mailstack-imappop3 = { path = "crates/imappop3" }
mailstack-imapd = { path = "crates/imapd" }
mailstack-webmail = { path = "crates/webmail" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
encoding_rs = "0.8"
base64 = "0.22"
regex = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
fs2 = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "limit"] }
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
clap = { version = "4", features = ["derive"] }

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "0.26"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"
